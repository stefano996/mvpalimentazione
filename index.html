<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sazio</title>
<meta name="theme-color" content="#0D1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sazio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<link rel="icon" href="icone/icona-192.png">
<link rel="icon" type="image/svg+xml" href="icone/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
 --bg:#F1F4EF;--surface:#FFFFFF;--surface-2:#E8EEE7;--ink:#13241B;--mute:#5A6A61;--line:#DDE4DB;
 --brand:#1E5B42;--brand-2:#174A35;--on-brand:#FFFFFF;--tonal:#D8EEDF;--on-tonal:#174A35;
 --hero:#173F2E;--on-hero:#F1F7F2;--hero-mute:#A9C4B4;--lime:#B7E86A;
 --sun:#E9A21F;--sun-t:#FCEFD3;--leaf:#2F8A5B;--leaf-t:#E0F0E3;--sky:#3D63B0;--sky-t:#E4EBF7;
 --coral:#C9472A;--coral-t:#FBE4DC;--heart:#E0473C;--warn-t:#FFF4D6;
 --sh:0 1px 2px rgba(19,52,36,.05),0 8px 20px -10px rgba(19,52,36,.18);
 --sh-float:0 12px 32px -12px rgba(19,52,36,.40);
 --r-xl:28px;--r-lg:20px;--r-md:14px;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0D1411;--surface:#151F1A;--surface-2:#1D2923;--ink:#E7EFE9;--mute:#93A49A;--line:#25332C;
 --brand:#B7E86A;--brand-2:#CBEF8E;--on-brand:#0D1411;--tonal:#1E3A2B;--on-tonal:#C6EE8A;
 --hero:#183B2B;--on-hero:#EEF6F0;--hero-mute:#9CBBA9;
 --sun:#F2B23A;--sun-t:#33291A;--leaf:#6CC896;--leaf-t:#1B3225;--sky:#9DB7F2;--sky-t:#1B2436;
 --coral:#F08A6C;--coral-t:#3A221B;--heart:#F0706A;--warn-t:#3A3118;
 --sh:0 0 0 1px var(--line);--sh-float:0 12px 32px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0D1411;--surface:#151F1A;--surface-2:#1D2923;--ink:#E7EFE9;--mute:#93A49A;--line:#25332C;
 --brand:#B7E86A;--brand-2:#CBEF8E;--on-brand:#0D1411;--tonal:#1E3A2B;--on-tonal:#C6EE8A;
 --hero:#183B2B;--on-hero:#EEF6F0;--hero-mute:#9CBBA9;
 --sun:#F2B23A;--sun-t:#33291A;--leaf:#6CC896;--leaf-t:#1B3225;--sky:#9DB7F2;--sky-t:#1B2436;
 --coral:#F08A6C;--coral-t:#3A221B;--heart:#F0706A;--warn-t:#3A3118;
 --sh:0 0 0 1px var(--line);--sh-float:0 12px 32px -12px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:0 auto;padding:var(--s4) max(var(--s4),env(safe-area-inset-left)) calc(112px + env(safe-area-inset-bottom,0))}
.page{display:flex;flex-direction:column;gap:var(--s3)}
.stack{display:flex;flex-direction:column;gap:var(--s3)}.stack>.btn{margin-top:0}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800}h2{font-size:1.2rem;font-weight:700}h3{font-size:1.02rem;font-weight:700}
b,.num{font-variant-numeric:tabular-nums}
a{color:var(--brand);font-weight:700;text-decoration:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label:focus-within .cb{outline:2px solid var(--brand);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{color:var(--mute);font-size:.88rem;margin:0}
.sub{color:var(--mute);margin:var(--s1) 0 0}
#intro{margin-bottom:var(--s5)}
.warn{background:var(--warn-t);color:var(--ink);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin:0}

/* ---------- struttura ---------- */
.ph{margin:var(--s2) 0 var(--s3);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap}.ph>div{min-width:0}.ph .note{margin:0 0 var(--s1);font-weight:500}
.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--sun-t);color:var(--ink);font:800 1.2rem "Bricolage Grotesque",sans-serif;cursor:pointer;flex:none}
.ph:has(+.here){margin-bottom:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin:var(--s5) 0 0}
.lnk{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--brand);font-weight:700;font-size:.95rem;min-height:44px;padding:0 0 0 var(--s3);cursor:pointer}.lnk .i{width:18px;height:18px}
.w,.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh);margin:0}
.card>h2{margin:0}.card>h2+label,.card>h2+p{margin-top:var(--s3)}

/* ---------- barra di navigazione flottante ---------- */
.tabbar{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:max(var(--s2),calc(env(safe-area-inset-bottom,0px) - 14px));width:min(calc(100% - 24px),440px);display:flex;gap:var(--s1);padding:var(--s2);border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh-float);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--mute);font:600 11px "DM Sans",sans-serif;min-height:52px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tabbar .i{width:22px;height:22px}
.tabbar button[aria-selected=true]{background:var(--tonal);color:var(--on-tonal)}

/* ---------- pulsanti ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:54px;margin-top:var(--s4);border:0;border-radius:16px;background:var(--brand);color:var(--on-brand);font:700 16px "DM Sans",sans-serif;padding:0 var(--s4);cursor:pointer;text-align:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.tonal{background:var(--tonal);color:var(--on-tonal)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);min-height:40px;padding:0 var(--s4);border-radius:999px;border:0;font:600 .9rem "DM Sans",sans-serif;cursor:pointer;transition:transform .12s}
.pill:active{transform:scale(.96)}.pill .i{width:18px;height:18px}
.pill.tonal{background:var(--surface-2);color:var(--ink)}
.pill.coral{background:var(--coral-t);color:var(--coral)}
.icon-btn{display:grid;place-items:center;flex:none;width:54px;height:54px;border-radius:16px;background:var(--tonal);color:var(--on-tonal)}
.x{display:grid;place-items:center;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;cursor:pointer;width:40px;height:40px;flex:none}.x .i{width:18px;height:18px}
.xr .x{background:none;color:var(--mute)}

/* ---------- home ---------- */
.here{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s1);align-self:flex-start;background:var(--surface);box-shadow:var(--sh);border-radius:999px;padding:0 var(--s2) 0 var(--s3);color:var(--brand)}
.here select{width:auto;border:0;background:none;padding:var(--s3) var(--s2);font-weight:700;color:var(--ink);min-height:44px}
.prow{display:flex;align-items:center;gap:var(--s3);width:100%;border:0;text-align:left;cursor:pointer;padding:var(--s3) var(--s4)}
.av{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--sun-t);color:var(--ink);font:800 1.2rem "Bricolage Grotesque",sans-serif;flex:none}
.prow-b{flex:1;min-width:0}.prow-b b{display:block;font-size:1rem}.prow-b span{display:block;color:var(--mute);font-size:.86rem;line-height:1.35}
.prow>.i{color:var(--mute)}
.hero{display:flex;align-items:center;gap:var(--s5);background:var(--hero);color:var(--on-hero);border-radius:var(--r-xl);padding:var(--s5);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lime) 22%,transparent),transparent 70%);pointer-events:none}
.hero-ring{position:relative;width:118px;height:118px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}.ring-bg{stroke:color-mix(in srgb,var(--on-hero) 14%,transparent)}.ring-fg{stroke:var(--lime);stroke-linecap:round}
.ring.anim .ring-fg{animation:ring 1s cubic-bezier(.2,.8,.2,1) both}@keyframes ring{from{stroke-dashoffset:var(--c)}}
.hero-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-c b{font:800 1.6rem "Bricolage Grotesque",sans-serif;line-height:1}.hero-c span{font-size:.72rem;color:var(--hero-mute);margin-top:3px}
.hero-l{margin:0;display:grid;gap:var(--s2);flex:1;min-width:0}
.hero-l div{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline;border-bottom:1px solid color-mix(in srgb,var(--on-hero) 12%,transparent);padding-bottom:var(--s2)}
.hero-l div:last-child{border:0;padding:0}
.hero-l dt{color:var(--hero-mute);font-size:.85rem}.hero-l dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* card del pasto */
.mc{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh);--t:var(--leaf-t);--c:var(--leaf)}
.mc.m-col{--t:var(--sun-t);--c:var(--sun)}.mc.m-cen{--t:var(--sky-t);--c:var(--sky)}
.mc-row{display:flex;align-items:flex-start;gap:var(--s3)}
.mc-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);background:var(--t);color:var(--c);flex:none}
.mc-b{flex:1;min-width:0}.mc-b small{display:block;color:var(--mute);font-size:.8rem;font-weight:600}
.mc-b h3{margin:var(--s1) 0;font-size:1.05rem}
.mc-m{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin:0;color:var(--mute);font-size:.86rem}.mc-m span{font-variant-numeric:tabular-nums}
.extra{display:block;font-size:.83rem;color:var(--mute);margin:0 0 var(--s1)}
.mc-sg{display:flex;gap:var(--s2);align-items:flex-start;margin:var(--s2) 0 0;color:var(--coral);font-weight:700;font-size:.9rem}.mc-sg .i{width:18px;height:18px;margin-top:1px}
.mc-act{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s3) 0 0}.mc-act:empty{display:none}
.tick{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;cursor:pointer;flex:none;transition:background .2s,border-color .2s,transform .15s}
.tick[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
.mc.is-ok .mc-b,.mc.is-ok .mc-ic{opacity:.6}.mc.is-ok h3{text-decoration:line-through;text-decoration-thickness:1.5px}
.mc.is-sg{background:linear-gradient(var(--coral-t),var(--coral-t)) top/100% 4px no-repeat,var(--surface)}.mc.is-sg h3{text-decoration:line-through;color:var(--mute)}

/* spesa in home */
.st{display:flex;align-items:center;gap:var(--s3)}
.st-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);background:var(--tonal);color:var(--on-tonal);flex:none}
.st-b{flex:1;min-width:0}.st-b b{display:block}.st-b span{display:block;color:var(--mute);font-size:.86rem}
.st-more{margin:calc(var(--s2)*-1) 0 0 56px;color:var(--mute);font-size:.86rem}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.nums div{background:var(--surface-2);border-radius:var(--r-md);padding:var(--s3)}
.nums b{display:block;font:800 1.25rem "Bricolage Grotesque",sans-serif}.nums span{font-size:.8rem;color:var(--mute)}
.bar{height:8px;background:var(--surface-2);border-radius:9px;margin:0;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .4s}
.spw-a{display:flex;gap:var(--s3);align-items:center}.spw-a .btn{flex:1;margin:0}

/* ---------- settimana ---------- */
.bento{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s3)}
.tile{border-radius:var(--r-lg);padding:var(--s4);background:var(--surface);box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .i{color:var(--brand);margin-bottom:var(--s3)}
.tile b{font:800 1.45rem "Bricolage Grotesque",sans-serif}.tile span{color:var(--mute);font-size:.84rem;line-height:1.3}
.tile.brand{background:var(--brand);color:var(--on-brand);box-shadow:none}.tile.brand .i,.tile.brand span{color:inherit}.tile.brand span{opacity:.8}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2);margin-top:var(--s3)}
.days button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-md);padding:var(--s2) 0;min-height:60px;cursor:pointer;position:relative}
.days span{font-size:.72rem;color:var(--mute);font-weight:600;text-transform:capitalize}.days b{font:800 1.1rem "Bricolage Grotesque",sans-serif}
.days button.today::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--sun)}
.days button[aria-selected=true]{background:var(--brand);color:var(--on-brand);box-shadow:none}.days button[aria-selected=true] span{color:inherit;opacity:.8}
.dsum{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s3)}

/* ---------- spesa ---------- */
.seg{display:flex;gap:var(--s1);background:var(--surface-2);padding:var(--s1);border-radius:var(--r-lg)}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-weight:600;font-size:.95rem;min-height:44px;border-radius:var(--r-md);cursor:pointer}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg.wk button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;line-height:1.2;padding:var(--s1) 2px}
.seg.wk b{font-size:.84rem}.seg.wk span{font-size:.74rem;font-weight:500}
.seg.wk .now b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sun);margin-left:var(--s1);vertical-align:middle}
.sel{position:relative;display:flex;align-items:center;gap:var(--s2);background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-md);padding:0 var(--s3);color:var(--brand)}
.sel select{border:0;background:none;padding:var(--s4) var(--s1);min-height:52px;font-weight:600;color:var(--ink)}
.car{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--s4);margin:0 calc(var(--s4)*-1);padding:var(--s1) var(--s4) var(--s2);scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.sc{flex:0 0 72%;max-width:250px;scroll-snap-align:start;background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;position:relative}
.sc.rec{box-shadow:inset 0 0 0 2px var(--brand),var(--sh)}
.sc-t{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}.sc-t .fav{margin-left:auto}
.sc b{font-size:1.05rem}.sc>span{color:var(--mute);font-size:.86rem;line-height:1.35}
.sc-f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:var(--s3)}
.sc-f a{display:inline-flex;align-items:center;gap:var(--s1);min-height:40px;padding:0 var(--s3);border-radius:999px;background:var(--tonal);color:var(--on-tonal);font-size:.9rem}.sc-f a .i{width:16px;height:16px}
.badge{background:var(--brand);color:var(--on-brand);font-size:.72rem;font-weight:700;padding:3px var(--s2);border-radius:999px}
.list{padding:0 var(--s4)}
.sp{font-size:1rem;font-weight:400;color:var(--ink);display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line);cursor:pointer;min-height:52px;margin:0}.sp:first-child{border-top:0}
.sp input{position:absolute;opacity:0;width:1px;height:1px}
.cb{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);color:transparent;flex:none;transition:background .15s,border-color .15s}
.cb .i{width:16px;height:16px;stroke-width:3}
.sp input:checked+.cb{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.sp-n{flex:1;min-width:0}.sp input:checked~.sp-n{text-decoration:line-through;color:var(--mute)}
.sp-q{color:var(--mute);font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.sp-h{display:flex;align-items:center;gap:var(--s3)}.sp-h a{margin-left:auto;display:inline-flex;align-items:center;gap:var(--s1);font-size:.9rem}.sp-h a .i{width:16px;height:16px}

/* ---------- componenti condivisi ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s3)}
.kpi div{min-width:0;background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-lg);padding:var(--s3) var(--s4)}
.kpi div:first-child{background:var(--brand);color:var(--on-brand);box-shadow:none}
.kpi b{display:block;font:800 1.25rem "Bricolage Grotesque",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi span{display:block;font-size:.84rem;line-height:1.3;opacity:.8}
.tags{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s1)}
.tag{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.tag.p{background:var(--sun-t);color:var(--ink)}
.tag.b{border:0;cursor:pointer;font:500 .9rem "DM Sans",sans-serif;padding:9px var(--s4);background:var(--surface-2)}
.tag.b:active{background:var(--tonal)}
label{display:block;font-size:.86rem;font-weight:600;color:var(--mute);margin:var(--s4) 0 var(--s2)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-md);padding:var(--s3) var(--s4);min-height:50px;transition:border-color .15s,background .15s}
textarea{resize:vertical;min-height:120px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.addr{display:flex;gap:var(--s2)}.addr .btn{width:auto;margin:0;padding:0 var(--s4)}
.sug{margin:var(--s3) 0}
.ex{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--line)}
.ex select{width:auto;padding:var(--s2) var(--s3);min-height:40px}.xr{display:flex;gap:var(--s1);align-items:center}
.shop{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.shop span{color:var(--mute);font-size:.9rem}
.fav{border:0;background:none;padding:0;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none;margin:calc(var(--s2)*-1) calc(var(--s2)*-1) calc(var(--s2)*-1) 0}

.tot-b{flex:1;min-width:0}
.icon-btn.sm{width:44px;height:44px;border:0;cursor:pointer;border-radius:50%}
.tag .x-in{border:0;background:none;color:var(--mute);padding:0 0 0 4px;display:inline-flex;vertical-align:middle;cursor:pointer}.tag .x-in .i{width:14px;height:14px}
.tag.b.buy{background:var(--tonal);color:var(--on-tonal)}
.tag.b.buy.on{background:var(--brand);color:var(--on-brand)}
.sgi .stepper span{min-width:34px;max-width:130px;font-size:.85rem;line-height:1.2;white-space:normal}

/* lista della spesa manuale */
.sp{display:flex;align-items:center;gap:var(--s2)}
.sp-l{display:flex;align-items:center;gap:var(--s3);flex:1;min-width:0;cursor:pointer}
.sp .x{width:32px;height:32px}
.star{color:var(--sun);display:inline-flex}.star .i{width:16px;height:16px;fill:currentColor}
.star-ic{background:var(--sun-t)!important;color:var(--sun)!important}
.tag.b .i{fill:none}
.list.cons .li{min-height:52px}
.row2{display:flex;gap:var(--s2);flex-wrap:wrap}.row2 .btn{flex:1}
.sp-tot .tot{display:flex;align-items:center;gap:var(--s3)}
.sp-tot .tot b{display:block;font:800 1.6rem "Bricolage Grotesque",sans-serif;line-height:1.1}
.sp-tot .tot span:not(.st-ic){color:var(--mute);font-size:.9rem}
.stor{display:flex;flex-direction:column}
.stor-r{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line)}
.stor-r>div{flex:1;min-width:0;display:flex;flex-direction:column}
.stor-r span{color:var(--mute);font-size:.82rem}
.stor-r .x{width:32px;height:32px}
.mc-act{flex-wrap:wrap}
.sugg{display:inline-flex;color:var(--brand);margin-left:6px;vertical-align:middle}.sugg .i{width:16px;height:16px}
body.kb .tabbar{display:none}

.li-lib{border-radius:var(--r-md);background:var(--surface-2);margin:var(--s2) 0}
.nuovo{background:var(--surface-2);border-radius:var(--r-md);padding:var(--s3);margin-top:var(--s3)}
.nuovo input,.nuovo select{background:var(--surface)}
.lb-list{margin-top:var(--s3)}
.days.mini button[aria-pressed=true] span,.days.mini button[aria-pressed=true] b{color:var(--on-brand)}
.nonsai{align-self:flex-start;background:var(--tonal);color:var(--on-tonal)}.nonsai .i{color:var(--brand)}
#nonsai-st:empty{display:none}
</style>

// ---------- Dispensa ----------
// S.dispensa[id] = {q: quantità (g o ml) al giorno t, t: "aaaa-mm-gg", g: consumo fisso al giorno (acqua, caffè…)}
// quanto resta oggi = q meno quello che il piano ha usato da t a ieri (i pasti segnati come sgarro non contano)
const oggi0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dIso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dParse=t=>{const[y,m,g]=t.split("-").map(Number);return new Date(y,m-1,g)};
const LIQ=new Set(["olio","acqua","latte","aceto","salsa-soia","latte-soia","latte-cocco","passata"]);
const fmtQ=(id,g)=>{const u=LIQ.has(id)?["ml","l"]:["g","kg"];g=Math.max(0,g);return g>=1000?(g/1000).toFixed(g>=10000?0:1).replace(".",",").replace(",0","")+" "+u[1]:Math.round(g)+" "+u[0]};
const fisso=id=>{const e=(S.dispensa||{})[id];return e&&e.g!=null?e.g:I[id].giorno||0};
function usoGiorno(id,d){if(S.modo=="mia"&&!S.dieta)return 0;const P=planW(lun(d));if(!P)return 0;const day=P.days[(d.getDay()+6)%7],e=S.diario[dKey(d)]||{};let g=0;
 day.ms.forEach((x,j)=>{if(x&&!(e[j]&&e[j].s=="sg"))g+=x.g[id]||0});return g}
function resto(id,al){const e=(S.dispensa||{})[id];if(!e)return null;let q=e.q,d=dParse(e.t),n=0;const fine=al||oggi0(),f=fisso(id);
 while(d<fine&&n<200){q-=usoGiorno(id,d)+f;d=addD(d,1);n++}return Math.max(0,q)}
function giorniRimasti(id){let q=resto(id);if(q==null)return null;let d=oggi0();const f=fisso(id);
 for(let n=0;n<60;n++){q-=usoGiorno(id,d)+f;if(q<0)return n;d=addD(d,1)}return 60}
function setDisp(id,q){const e=(S.dispensa||{})[id];S.dispensa={...(S.dispensa||{}),[id]:{q:Math.max(0,q),t:dIso(oggi0()),...(e&&e.g!=null?{g:e.g}:{}),...(e&&e.m?{m:1}:{})}};save()}
// cosa comprare davvero in una spesa: tolto quello che c'è in dispensa, più quello che in dispensa sta per finire
function spesaTrip(P,ti){const T=P.trips[ti],d0=addD(P.monday,T.gg[0]),d1=addD(P.monday,T.gg[T.gg.length-1]+1),D=S.dispensa||{},c=chkGet(),x={q:{},gia:[],base:[],fin:[],cost:0};
 for(const id in T.tot){const need=T.tot[id];
  if(D[id]){const k=ck(P,ti,id),r=resto(id,d0)-(c[k]?((S.presiAdd||{})[k]||{}).n||0:0);if(r>=need)x.gia.push(id);else x.q[id]=need-Math.max(0,r)}
  else if(I[id].base)x.base.push(id);else x.q[id]=need}
 for(const id in D){if(!I[id]||id in T.tot)continue;const k=ck(P,ti,id);if(resto(id,d1)-(c[k]?((S.presiAdd||{})[k]||{}).n||0:0)<=0){x.q[id]=confD(id);x.fin.push(id)}}
 x.cost=Object.entries(x.q).reduce((a,[id,g])=>a+spend(g,id),0);return x}
const confD=id=>I[id].conf||(I[id].pz?I[id].pz[0]*4:500);
const GIORNI_SPESA=()=>S.cucina=="poco"?4:7;
function prossimaSpesa(giorni){const D=S.dispensa||{},c=chkGet(),add=S.presiAdd||{},key=id=>"s"+(S.spesaN||0)+":"+id,x={q:{},gia:[],base:[],fin:[],man:[],k:key};
 const oggi=oggi0(),N=giorni||GIORNI_SPESA(),need={};
 for(let i=0;i<N;i++){const d=addD(oggi,i),P=planW(lun(d));if(!P)continue;const day=P.days[(d.getDay()+6)%7],e=S.diario[dKey(d)]||{};
  day.ms.forEach((m,j)=>{if(!m||(e[j]&&(e[j].s=="sg"||(i==0&&e[j].s=="ok"))))return;for(const id in m.g)need[id]=(need[id]||0)+m.g[id]})}
 const pa=id=>c[key(id)]?(add[key(id)]||{}).n||0:0;
 for(const id in need){if(!I[id])continue;
  if(D[id]){const r=resto(id)-pa(id);if(r>=need[id])x.gia.push(id);else x.q[id]=need[id]-Math.max(0,r)}
  else if(I[id].base)x.base.push(id);else x.q[id]=need[id]}
 for(const id in D){if(!I[id]||id in need)continue;if(resto(id,addD(oggi,N))-pa(id)<=0){x.q[id]=confD(id);x.fin.push(id)}}
 for(const id in (S.daComprare||{})){if(!I[id]||!S.daComprare[id])continue;x.q[id]=Math.max(x.q[id]||0,confD(id));x.man.push(id);x.gia=x.gia.filter(i=>i!=id)}
 return x}

function spunta(it,on){it.fatto=on;if(!it.id){save();return}const id=it.id;
 if(on){const c=I[id].conf,q=it.q||confD(id),n=c?Math.max(1,Math.ceil(q/c-.05))*c:q;it.add={n,nuovo:!(S.dispensa||{})[id]};setDisp(id,(resto(id)||0)+n)}

function presoInDispensa(k,on,q){const id=k.split(":").pop();if(!I[id])return;S.presiAdd=S.presiAdd||{};
